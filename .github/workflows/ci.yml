name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/evaluate.py --output /tmp/evaluation.json
      - run: uv run python scripts/evaluate.py --case independent-work-v1 --repetitions 1 --output /tmp/independent.json
      - run: uv run python scripts/evaluate.py --case review-repair-v1 --repetitions 1 --output /tmp/review.json
      - uses: actions/upload-artifact@v4
        with:
          name: process-evaluation
          path: |
            /tmp/evaluation.json
            /tmp/independent.json
            /tmp/review.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
