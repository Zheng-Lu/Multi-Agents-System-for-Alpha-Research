[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-mas-lab"
version = "0.1.0"
description = "Observable multi-provider alpha research coordination laboratory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "numpy>=2.2,<2.4", "pandas>=2.2,<3",
  "scipy>=1.15,<2", "jsonschema>=4.23,<5", "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema", "pandas-stubs", "scipy-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/alpha_mas"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["backend/src/alpha_mas"]
check_untyped_defs = true
ignore_missing_imports = true
